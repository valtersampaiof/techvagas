# Uma vez por mês, confere se os links dos cursos ainda abrem. Se algum estiver quebrado, o GitHub avisa por e-mail.
# Também pode ser rodado na hora: aba "Actions" > "Verificar links dos cursos" > "Run workflow".
name: Verificar links dos cursos

on:
  schedule:
    - cron: "43 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir os links
        run: npm run cursos:verificar-links
